<!doctype html>
<html lang="en">
<head>

<title>Impact card</title>

</head>
<body>
<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:504px;box-sizing:border-box;border-radius:18px;padding:10px;background:{{f.frame}};box-shadow:0 14px 34px rgba(0,0,0,.45);font-family:Fredoka,sans-serif">
<div style="position:relative;width:340px;height:484px;border-radius:10px;overflow:hidden;background:{{f.field}};box-shadow:inset 0 0 0 2px {{f.inner}}">

<div style="position:absolute;left:-40px;top:150px;width:420px;height:420px;background:{{f.burstEdge}};clip-path:polygon(100.0% 50.0%,82.4% 56.4%,96.2% 69.1%,77.4% 68.3%,85.4% 85.4%,68.3% 77.4%,69.1% 96.2%,56.4% 82.4%,50.0% 100.0%,43.6% 82.4%,30.9% 96.2%,31.7% 77.4%,14.6% 85.4%,22.6% 68.3%,3.8% 69.1%,17.6% 56.4%,0.0% 50.0%,17.6% 43.6%,3.8% 30.9%,22.6% 31.7%,14.6% 14.6%,31.7% 22.6%,30.9% 3.8%,43.6% 17.6%,50.0% 0.0%,56.4% 17.6%,69.1% 3.8%,68.3% 22.6%,85.4% 14.6%,77.4% 31.7%,96.2% 30.9%,82.4% 43.6%)"></div>
<div style="position:absolute;left:-28px;top:162px;width:396px;height:396px;background:{{f.burst}};clip-path:polygon(100.0% 50.0%,82.4% 56.4%,96.2% 69.1%,77.4% 68.3%,85.4% 85.4%,68.3% 77.4%,69.1% 96.2%,56.4% 82.4%,50.0% 100.0%,43.6% 82.4%,30.9% 96.2%,31.7% 77.4%,14.6% 85.4%,22.6% 68.3%,3.8% 69.1%,17.6% 56.4%,0.0% 50.0%,17.6% 43.6%,3.8% 30.9%,22.6% 31.7%,14.6% 14.6%,31.7% 22.6%,30.9% 3.8%,43.6% 17.6%,50.0% 0.0%,56.4% 17.6%,69.1% 3.8%,68.3% 22.6%,85.4% 14.6%,77.4% 31.7%,96.2% 30.9%,82.4% 43.6%)"></div>

<div style="position:absolute;left:0;right:0;top:0;height:38px;background:{{f.plate}};border-bottom:2px solid {{f.plateEdge}};display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box">
<img src="/_blob/1e25670d6b64f000805d97c64546aa87" alt="Doge Dash" style="width:150px;height:28px;object-fit:contain">
<span style="font-size:10px;font-weight:700;letter-spacing:2px;color:{{f.text}}">IMPACT</span>
</div>

<div style="position:absolute;left:14px;top:46px;font-family:'Luckiest Guy',cursive;font-size:108px;line-height:1;transform:rotate(-7deg);transform-origin:left top;background:{{f.letter}};-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px {{f.stroke}};filter:drop-shadow({{f.shadow}})">DASH!</div>

<svg style="position:absolute;right:16px;top:150px" width="26" height="46" viewBox="0 0 22 40" aria-hidden="true"><polygon points="14,0 0,22 10,22 4,40 22,14 12,14 18,0" fill="{{f.bolt}}" stroke="{{f.stroke}}" stroke-width="1.5"></polygon></svg>
<svg style="position:absolute;left:14px;top:300px" width="22" height="40" viewBox="0 0 22 40" aria-hidden="true"><polygon points="14,0 0,22 10,22 4,40 22,14 12,14 18,0" fill="{{f.bolt}}" stroke="{{f.stroke}}" stroke-width="1.5"></polygon></svg>
<svg style="position:absolute;right:30px;top:360px" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,0 14.5,9.5 24,12 14.5,14.5 12,24 9.5,14.5 0,12 9.5,9.5" fill="{{f.bolt}}" stroke="{{f.stroke}}" stroke-width="1.2"></polygon></svg>

<img src="{{art}}" alt="{{dash}}" style="position:absolute;left:45px;top:168px;width:250px;height:250px;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))">

<sc-if value="{{hasSerial}}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;right:12px;top:118px;transform:rotate(8deg);background:{{f.plate}};border:2px solid {{f.plateEdge}};border-radius:8px;padding:4px 9px;font-family:'Luckiest Guy',cursive;font-size:18px;color:{{f.text}};line-height:1">{{serial}}</div>
</sc-if>

<div style="position:absolute;left:10px;right:10px;bottom:10px;background:{{f.plate}};border:2px solid {{f.plateEdge}};border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between">
<span style="font-family:'Luckiest Guy',cursive;font-size:22px;color:{{f.text}};line-height:1;letter-spacing:.5px">{{dash}}</span>
<span style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:#ffffff">{{f.label}}</span>
</div>

</div>
</div>
</x-dc>
