<div style="position:relative;width:360px;height:504px">
<sc-if value="{{c.isImpact}}" hint-placeholder-val="{{ false }}">
<dc-import name="ImpactCard" finish="{{c.finish}}" art="{{c.art}}" dash="{{c.name}}" serial="{{c.serial}}" hint-size="360px,504px"></dc-import>
</sc-if>
<sc-if value="{{c.isSeries}}" hint-placeholder-val="{{ true }}">
<dc-import name="SeriesCard" kind="{{c.k}}" art="{{c.art}}" bg="{{c.bg}}" dash="{{c.name}}" serial="{{c.serial}}" no="{{c.no}}" pup="{{c.pup}}" tok="{{c.tok}}" hint-size="360px,504px"></dc-import>
</sc-if>
<sc-if value="{{c.isAdv}}" hint-placeholder-val="{{ false }}">
<dc-import name="AdventureCard" scene="{{c.scene}}" serial="{{c.serial}}" version="{{c.version}}" hint-size="360px,504px"></dc-import>
</sc-if>
<sc-if value="{{c.isLvl}}" hint-placeholder-val="{{ false }}">
<dc-import name="LevelCard" level="{{c.level}}" part="{{c.part}}" serial="{{c.serial}}" version="{{c.version}}" hint-size="360px,504px"></dc-import>
</sc-if>
<sc-if value="{{c.isEnemy}}" hint-placeholder-val="{{ false }}">
<dc-import name="EnemyCard" enemy="{{c.enemy}}" design="{{c.design}}" serial="{{c.serial}}" version="{{c.version}}" hint-size="360px,504px"></dc-import>
</sc-if>
<sc-if value="{{c.isKey}}" hint-placeholder-val="{{ false }}">
<dc-import name="KeyCard" design="{{c.keyId}}" serial="{{c.serial}}" hint-size="360px,504px"></dc-import>
</sc-if>
<sc-if value="{{c.holoCard}}" hint-placeholder-val="{{ false }}">
<div class="holoL" style="position:absolute;left:0;top:0;width:360px;height:504px;border-radius:18px;background-position:{{gx}}% {{gy}}%"></div>
<div class="iceL" style="position:absolute;left:0;top:0;width:360px;height:504px;border-radius:18px;opacity:.8"></div>
</sc-if>
<sc-if value="{{c.holoDash}}" hint-placeholder-val="{{ false }}">
<div class="holoL {{c.mask}}" style="position:absolute;left:{{c.mx}}px;top:{{c.my}}px;width:{{c.mw}}px;height:{{c.mh}}px;opacity:.85;background-position:{{gx}}% {{gy}}%;{{c.maskStyle}}"></div>
<div class="iceL {{c.mask}}" style="position:absolute;left:{{c.mx}}px;top:{{c.my}}px;width:{{c.mw}}px;height:{{c.mh}}px;{{c.maskStyle}}"></div>
</sc-if>
<sc-if value="{{back}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;width:360px;height:504px">
<dc-import name="CardBack" copies="{{c.copiesN}}" printed="{{c.printed}}" dash="{{c.name}}" set="{{c.backSet}}" version="{{c.backVer}}" serial="{{c.serial}}" tok="{{c.tokLabel}}" no="{{c.no}}" hint-size="360px,504px"></dc-import>
</div>
</sc-if>
<sc-if value="{{glare}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;width:360px;height:504px;border-radius:18px;pointer-events:none;background:radial-gradient(circle at {{gx}}% {{gy}}%,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 50%);mix-blend-mode:overlay"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
renderVals() {
const p = this.props;
return { c: p.card || {}, back: !!p.back, glare: p.glare !== false, gx: p.gx ?? 50, gy: p.gy ?? 40 };
}
}
</script>
</body>
