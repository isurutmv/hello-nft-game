<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dash Adventures card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:504px;box-sizing:border-box;border-radius:18px;padding:10px;background:#ffffff;box-shadow:0 14px 34px rgba(0,0,0,.45);font-family:Fredoka,sans-serif">
<div style="position:relative;width:340px;height:484px;border-radius:10px;overflow:hidden;background:#3aa8f0">

<sc-if value="{{home}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#2f8ff0 0%,#5fc0f5 55%,#a8e6ff 100%)"></div>
<div style="position:absolute;left:-40px;top:110px;width:180px;height:60px;border-radius:40px;background:#e8fbff;opacity:.9"></div>
<div style="position:absolute;left:220px;top:70px;width:160px;height:50px;border-radius:40px;background:#e8fbff;opacity:.8"></div>
<div style="position:absolute;left:180px;top:400px;width:200px;height:60px;border-radius:40px;background:#e8fbff;opacity:.9"></div>
</sc-if>
<sc-if value="{{level}}" hint-placeholder-val="{{ true }}">
<img src="{{bg}}" alt="" style="position:absolute;left:0;top:0;width:340px;height:484px;object-fit:cover;object-position:{{pos}}">
</sc-if>

<sc-for list="{{coins}}" as="c" hint-placeholder-count="3">
<img src="/_blob/56aff61c888ef5a73cf9b880f416c6d0" alt="" style="position:absolute;left:{{c.x}}px;top:{{c.y}}px;width:{{c.s}}px;height:{{c.s}}px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))">
</sc-for>
<sc-for list="{{sprites}}" as="sp" hint-placeholder-count="3">
<img src="{{sp.src}}" alt="" style="position:absolute;left:{{sp.x}}px;top:{{sp.y}}px;width:{{sp.w}}px;height:{{sp.h}}px;object-fit:contain;transform:rotate({{sp.r}}deg) scaleX({{sp.fx}});filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))">
</sc-for>
<sc-if value="{{hasWord}}" hint-placeholder-val="{{ false }}">
<span style="position:absolute;left:{{wx}}px;top:{{wy}}px;font-family:'Luckiest Guy',cursive;font-size:{{ws}}px;line-height:1;color:#ffe14d;-webkit-text-stroke:3px #1b1446;paint-order:stroke fill;transform:rotate(-8deg)">{{word}}</span>
</sc-if>

<img src="/_blob/5f0f787d42b1de3da20f158d29ae4d6b" alt="Doge Dash" style="position:absolute;left:10px;top:10px;width:96px;height:62px;object-fit:contain">
<div style="position:absolute;right:10px;top:12px;background:#1b1446;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:#ffe14d">ADVENTURE {{no}}/25</div>
<div style="position:absolute;left:10px;right:10px;bottom:10px;background:#1b1446;border:2px solid #ffe14d;border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:3px">
<span style="font-family:'Luckiest Guy',cursive;font-size:23px;line-height:1;color:#ffe14d">{{title}}</span>
<span style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:#ffffff">{{sub}}</span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
<span style="font-size:10px;font-weight:700;letter-spacing:1px;color:#c9c2f0">{{version}}</span>
<span style="font-size:12px;font-weight:700;color:#ffffff">{{serial}}</span>
</div>
</div>
</div>
</div>
</x-dc>
