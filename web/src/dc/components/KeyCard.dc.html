<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key card</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

</helmet>
<div style="position:relative;width:360px;height:504px;font-family:Fredoka,sans-serif;color:#ffffff">

</div>
</div>
</sc-if>
<sc-if value="{{kB}}" hint-placeholder-val="{{ false }}">

<span style="font-size:11px;font-weight:600;letter-spacing:2px;color:#c9c2f0">{{serial}}</span>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{kC}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing:border-box;padding:10px;background:linear-gradient(135deg,#fff3b0 0%,#e2a812 22%,#fff0a0 40%,#b97c06 60%,#ffe27a 80%,#c98a0b 100%);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 40px rgba(255,225,77,.35);">
<div style="position:relative;width:340px;height:484px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#2f8ff0 0%,#5fc0f5 60%,#a8e6ff 100%)">

<div class="kc-holo" style="position:absolute;left:45px;top:210px;width:250px;height:250px;border-radius:50%;opacity:.55"></div>
<img class="kc-bob" src="/_blob/66f4b2c602337b35f1d35507f417f308" alt="Dash" style="position:absolute;left:95px;top:96px;width:150px;height:128px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))">
<div class="kc-sweep" style="animation-delay:-3s"></div>
<div style="position:absolute;left:0;right:0;top:22px;display:flex;justify-content:center"><img src="/_blob/1e25670d6b64f000805d97c64546aa87" alt="Doge Dash" style="width:200px;height:38px;object-fit:contain"></div>
<div style="position:absolute;left:12px;right:12px;bottom:12px;background:#1b1446;border:2px solid #ffe14d;border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between">

<span style="font-size:12px;font-weight:700">{{serial}}</span>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{kD}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing:border-box;padding:10px;background:linear-gradient(90deg,#ff9ad5,#ffe57a,#8dffc9,#7fd6ff,#c9a2ff,#ff9ad5);background-size:300% 100%;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 40px rgba(125,255,176,.35);animation:kcholo 6s linear infinite;">

</div>
</div>
<span style="position:absolute;left:96px;top:-8px;width:40px;height:22px;background:#ffffff;clip-path:polygon(0 0,100% 30%,60% 100%);transform:rotate(-20deg)"></span>
<span style="position:absolute;left:236px;top:-6px;width:30px;height:18px;background:#d6f7ff;clip-path:polygon(0 30%,100% 0,40% 100%);transform:rotate(14deg)"></span>
<img class="kc-bob" src="/_blob/368188bada7026c96cc1cf9b6bd14d1f" alt="Dash breaking out of the card" style="position:absolute;left:40px;top:-26px;width:280px;height:269px;object-fit:contain;transform:rotate(-4deg);filter:drop-shadow(0 16px 14px rgba(0,0,0,.55))">
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"design":{"editor":"enum","options":["A","B","C","D"],"default":"A"},"serial":{"editor":null,"default":"1 / 3"},"$preview":{"width":360,"height":504}}'>
class Component extends DCLogic {
renderVals() {
const k = String(this.props.design ?? 'A');
return { kA: k === 'A', kB: k === 'B', kC: k === 'C', kD: k === 'D', serial: this.props.serial ?? '1 / 3' };
}
}
</script>
</body>
